name: Weibo 24h Fetch

on:
  workflow_dispatch:
  schedule:
    # 每小时一次（UTC :05，即北京 :05）。
    #
    # 为什么不做更高频：微博脚本每次都抓「完整 24 小时窗口」（接口能翻页），
    # 所以频率只影响「最晚多久拿到」，不影响「有没有漏」——最坏晚 1 小时，一条不少。
    # 而 GitHub 对高频 schedule 会主动降频：之前设 20 分钟，实测被压到 35–45 分钟一次，
    # 一天 24 次，和「每小时一次」的实际效果一样。既然结果相同，就把配置改成诚实的每小时。
    - cron: "5 * * * *"

permissions:
  contents: write

jobs:
  fetch-24h:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Fetch last-24h posts (3962719063 挖地瓜的超级鹿鼎公)
        env:
          WEIBO_USER_ID: "3962719063"
        run: node scripts/crawl_weibo_24h.js

      - name: Commit fetched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weibo/
          git diff --cached --quiet || git commit -m "chore: weibo 24h fetch"
          git push
