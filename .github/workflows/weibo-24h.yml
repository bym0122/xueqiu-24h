name: Weibo 24h Fetch

on:
  workflow_dispatch:
  # ⚠️ schedule 已停用（2026-11-09）：微博改由本机 cron 抓（scripts/xq24-tick.sh）。
  #
  # 原因有两条：
  #   1) GH 会把 schedule 降频到 4–8 小时一次，而匿名接口每次只回最新 10 条，
  #      间隔越长中间漏得越多；
  #   2) 本机和 GH 同时写同一批 JSON，会撞成 merge 冲突（11-09 11:17 实测撞了两次）。
  #
  # 本机路径已实测可用（chromium + visitor cookie），见 xq24-tick.sh 里的注释。
  # 这个 workflow 保留，作为「手机挂了/抓不动」时的手动备用：workflow_dispatch 触发即可。
  # schedule:
  #   - cron: "5 * * * *"

permissions:
  contents: write

# 两个 run 撞在一起时，后一个 push 会被拒（11-09 的 663 就是这么红的）。
# 同一时间只允许一个 weibo 抓取在跑，后来的排队而不是互相踩。
concurrency:
  group: weibo-24h
  cancel-in-progress: false

jobs:
  fetch-24h:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      # 2026-10-30 起新增 4044309290（斯托伯的天空）：
      # 该作者 10-29 起表示不再在雪球发帖，转微博 + 公众号，故微博改为多账号循环。
      - name: Fetch last-24h posts (3962719063 鹿鼎公 / 4044309290 斯托伯的天空)
        run: |
          for uid in 3962719063 4044309290; do
            echo "===== crawling $uid ====="
            WEIBO_USER_ID="$uid" node scripts/crawl_weibo_24h.js || echo "WARN: $uid failed, continue"
          done

      - name: Commit fetched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weibo/
          git diff --cached --quiet || git commit -m "chore: weibo 24h fetch"
          # 别的手动 push / 另一个 run 可能刚好抢先，直接 push 会被拒（11-09 的 665 就是这样）。
          # 被拒就 rebase 一次再推；数据文件互相独立，不会真冲突。
          git push || { git pull --rebase --autostash origin main && git push; }
