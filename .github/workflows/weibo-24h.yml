name: Weibo 24h Fetch

on:
  workflow_dispatch:
  schedule:
    # 每 20 分钟一次（UTC）。原来 1 小时一次会漏掉密集发帖时段的部分内容。
    # 微博接口按 page 翻页，抓到 24h 窗口为止，频率越高覆盖越完整。
    - cron: "5,25,45 * * * *"

permissions:
  contents: write

jobs:
  fetch-24h:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Fetch last-24h posts (3962719063 挖地瓜的超级鹿鼎公)
        env:
          WEIBO_USER_ID: "3962719063"
        run: node scripts/crawl_weibo_24h.js

      - name: Commit fetched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weibo/
          git diff --cached --quiet || git commit -m "chore: weibo 24h fetch"
          git push
